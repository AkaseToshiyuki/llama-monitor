[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-monitor"
version = "1.1.0"
description = "A btop-inspired terminal monitor for llama.cpp and vLLM"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AkaseToshiyuki"}]
dependencies = [
  "psutil>=5.9",
  "requests>=2.28",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=11"]
amd = ["amdsmi"]
dev = [
  "build>=1.2",
  "ruff>=0.6",
]

[project.scripts]
llama-monitor = "llama_monitor:main"

[project.urls]
Homepage = "https://github.com/AkaseToshiyuki/llama-monitor"
Issues = "https://github.com/AkaseToshiyuki/llama-monitor/issues"

[tool.setuptools]
py-modules = ["llama_monitor"]

[tool.setuptools.packages.find]
include = ["llama_monitor_core*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
